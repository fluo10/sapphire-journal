[package]
name = "sapphire-journal-cli"
edition.workspace = true
version = "0.13.0"
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "text-processing"]
keywords = ["markdown", "task-management", "notes", "cli", "mcp"]

[[bin]]
name = "sapphire-journal"
path = "src/main.rs"

[features]
default = ["redb-store", "fastembed-embed"]
redb-store      = ["sapphire-journal-core/redb-store",      "sapphire-journal-mcp/redb-store"]
fastembed-embed = ["sapphire-journal-core/fastembed-embed", "sapphire-journal-mcp/fastembed-embed"]

[dependencies]
clap.workspace = true
sapphire-journal-core = { path = "../sapphire-journal-core", version = "0.13.0", default-features = false, features = ["text-input"] }
sapphire-journal-mcp  = { path = "../sapphire-journal-mcp", version = "0.2.0", default-features = false }
tokio = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
toml.workspace = true
