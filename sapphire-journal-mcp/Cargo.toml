[package]
name = "sapphire-journal-mcp"
edition.workspace = true
version = "0.1.0"
description = "MCP server library for sapphire-journal"
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["markdown", "task-management", "notes", "mcp"]

[lib]
path = "src/lib.rs"

[features]
default = ["redb-store", "fastembed-embed"]
redb-store = ["sapphire-journal-core/redb-store"]
fastembed-embed = ["sapphire-journal-core/fastembed-embed"]
http-server = ["rmcp/transport-streamable-http-server", "dep:axum", "dep:tokio-util"]

[dependencies]
sapphire-journal-core = { path = "../sapphire-journal-core", version = "0.12.0", default-features = false, features = ["text-input"] }
rmcp.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
chrono.workspace = true
anyhow.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
toml.workspace = true

[[test]]
name = "http_router"
path = "tests/http_router.rs"
required-features = ["http-server"]
