[workspace]
changelog_update = true
git_release_enable = true
git_tag_enable = true

[[package]]
name = "sapphire-journal-core"
git_tag_name = "core-v{{ version }}"
git_release_name = "core-v{{ version }}"

[[package]]
name = "sapphire-journal-cli"
git_tag_name = "cli-v{{ version }}"
git_release_name = "cli-v{{ version }}"

[[package]]
name = "sapphire-journal-mcp"
git_tag_name = "mcp-v{{ version }}"
git_release_name = "mcp-v{{ version }}"

# GitHub-release-only binary crate. `release = true` is load-bearing:
# release-plz silently skips any crate whose Cargo.toml has
# `publish = false` unless this is set, so without it no `desktop-v*`
# tag or GH release would ever be created. See sapphire-agent's
# release-plz.toml for the original write-up of this behaviour.
[[package]]
name = "sapphire-journal-desktop"
git_tag_name = "desktop-v{{ version }}"
git_release_name = "desktop-v{{ version }}"
publish = false
release = true

# Also GitHub-release-only: a self-hosted server binary, not a library
# for others to depend on, and it pulls sapphire-framework by git besides
# (crates.io rejects git dependencies outright). `publish = false` in its
# Cargo.toml means release-plz would otherwise skip it entirely, so
# `release = true` here is what still gets it a `server-v*` tag and GH
# release.
[[package]]
name = "sapphire-journal-server"
git_tag_name = "server-v{{ version }}"
git_release_name = "server-v{{ version }}"
publish = false
release = true
